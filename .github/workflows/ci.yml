name: release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read the repo
permissions:
  contents: read

jobs:
  build:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # sign build provenance via GitHub's OIDC token
      attestations: write # store the provenance attestation

    steps:
    # Actions are pinned to full commit SHAs so a moved tag can't change what runs
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build RoundedTB\RoundedTB.csproj -c Release

    - name: Check for vulnerable packages
      run: |
        $out = dotnet list RoundedTB\RoundedTB.csproj package --vulnerable --include-transitive
        $out
        if ($out -match 'has the following vulnerable packages') { exit 1 }

    - name: Package
      run: |
        $out = Get-ChildItem RoundedTB\bin\Release -Directory | Select-Object -First 1
        Compress-Archive -Path "$($out.FullName)\*" -DestinationPath RoundedTB.zip
        Copy-Item "$($out.FullName)\RoundedTB.exe", "$($out.FullName)\RoundedTB.dll" .

    # Lets anyone confirm a download was built from this repo: gh attestation verify <file> --repo <owner>/<repo>
    - name: Attest build provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          RoundedTB.zip
          RoundedTB.exe
          RoundedTB.dll

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rtb-${{ github.sha }}
        path: RoundedTB.zip
