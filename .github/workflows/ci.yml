name: release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read the repo
permissions:
  contents: read

jobs:
  build:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read         # SignPath downloads the unsigned artifact from this run
      id-token: write       # sign build provenance via GitHub's OIDC token
      attestations: write   # store the provenance attestation

    steps:
    # Actions are pinned to full commit SHAs so a moved tag can't change what runs
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build RoundedTB\RoundedTB.csproj -c Release

    - name: Check for vulnerable packages
      run: |
        $out = dotnet list RoundedTB\RoundedTB.csproj package --vulnerable --include-transitive
        $out
        if ($out -match 'has the following vulnerable packages') { exit 1 }

    - name: Locate build output
      id: build
      run: |
        $dir = (Get-ChildItem RoundedTB\bin\Release -Directory | Select-Object -First 1).FullName
        $version = (Get-Item "$dir\ReRoundedTB.exe").VersionInfo.FileVersion
        "dir=$dir" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "Build output: $dir (version $version)"

    # Code signing via SignPath Foundation. Skipped until the repository variable SIGNPATH_ORGANIZATION_ID is set
    # (plus SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN). See .signpath/README.md.
    - name: Upload unsigned build for signing
      id: upload-unsigned
      if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unsigned-${{ github.sha }}
        path: ${{ steps.build.outputs.dir }}\*

    - name: Sign with SignPath
      if: steps.upload-unsigned.outcome == 'success'
      uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        parameters: |
          version: "${{ steps.build.outputs.version }}"
        wait-for-completion: true
        output-artifact-directory: signed

    - name: Check signatures
      if: steps.upload-unsigned.outcome == 'success'
      run: |
        foreach ($f in 'signed\ReRoundedTB.exe', 'signed\ReRoundedTB.dll') {
          $sig = Get-AuthenticodeSignature $f
          "$f : $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne 'Valid') { exit 1 }
        }

    - name: Package
      run: |
        $src = if (Test-Path signed\ReRoundedTB.exe) { (Resolve-Path signed).Path } else { '${{ steps.build.outputs.dir }}' }
        "Packaging from $src"
        Compress-Archive -Path "$src\*" -DestinationPath ReRoundedTB.zip
        Copy-Item "$src\ReRoundedTB.exe", "$src\ReRoundedTB.dll" .

    # Lets anyone confirm a download was built from this repo: gh attestation verify <file> --repo <owner>/<repo>
    - name: Attest build provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          ReRoundedTB.zip
          ReRoundedTB.exe
          ReRoundedTB.dll

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rertb-${{ github.sha }}
        path: ReRoundedTB.zip
