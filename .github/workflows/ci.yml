name: release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read the repo
permissions:
  contents: read

jobs:
  build:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
    # Actions are pinned to full commit SHAs so a moved tag can't change what runs
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build RoundedTB\RoundedTB.csproj -c Release

    - name: Check for vulnerable packages
      run: |
        $out = dotnet list RoundedTB\RoundedTB.csproj package --vulnerable --include-transitive
        $out
        if ($out -match 'has the following vulnerable packages') { exit 1 }

    - name: Add commit hash to output folder
      run: |
        Rename-Item -Path ".\RoundedTB\bin\Release" -NewName "RoundedTB-$(git rev-parse --short ${{ github.sha }})"

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rtb-artifacts
        path: |
          .\RoundedTB\bin\RoundedTB-*\
