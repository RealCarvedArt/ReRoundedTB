name: release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only get the token scopes they list below
permissions:
  contents: read

jobs:
  # Builds untrusted code (any branch or PR), so it gets a read-only token and no signing or attestation rights
  build:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}

    steps:
    # Actions are pinned to full commit SHAs so a moved tag can't change what runs
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The SDK version comes from global.json so CI and local builds use the same toolchain
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # Locked mode fails if the package graph differs from packages.lock.json.
    # NuGetAudit (see RoundedTB.csproj) turns any known-vulnerable package into a build error.
    - name: Restore
      run: dotnet restore RoundedTB.sln --locked-mode

    - name: Build
      run: dotnet build RoundedTB\RoundedTB.csproj -c Release --no-restore

    # Includes the malformed-rtb.json corpus (the settings file is user-editable and loaded on every start)
    - name: Test
      run: dotnet test --project RoundedTB.Tests\RoundedTB.Tests.csproj -c Release --no-restore

    - name: Locate build output
      id: build
      run: |
        $dir = (Get-ChildItem RoundedTB\bin\Release -Directory | Select-Object -First 1).FullName
        $version = (Get-Item "$dir\ReRoundedTB.exe").VersionInfo.FileVersion
        "dir=$dir" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "Build output: $dir (version $version)"

    # Uploaded before any third-party tool (the SBOM generator below) runs, so that tool can't alter what gets signed and attested
    - name: Upload unsigned build
      id: upload-unsigned
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unsigned-${{ github.sha }}
        path: ${{ steps.build.outputs.dir }}\*

    # CycloneDX writes nothing (and still exits 0) if the output folder is missing, so create it and check the file
    - name: Generate SBOM
      run: |
        dotnet tool install --global CycloneDX --version 6.2.0
        New-Item -ItemType Directory -Force sbom | Out-Null
        dotnet-CycloneDX RoundedTB\RoundedTB.csproj --output sbom --filename ReRoundedTB.cdx.json --output-format Json --exclude-dev
        if (-not (Test-Path sbom\ReRoundedTB.cdx.json)) { Write-Error 'SBOM was not generated'; exit 1 }

    # Binary hardening (ASLR, DEP, CFG, high-entropy VA, ...): the desktop stand-in for web security-header checks.
    # The package is pinned by version and by the SHA-512 that nuget.org's catalog lists for it.
    - name: Check binary hardening (BinSkim)
      run: |
        $v = '4.4.9.13'
        Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$v/microsoft.codeanalysis.binskim.$v.nupkg" -OutFile binskim.zip
        $expected = '4D39D78C4E2AAC0C83287B5BB0EA55686117A480333CED46FC6E25E52A3A21ED919A9445977CA31181385C387A0DE89B1B8AEFFB1142B4A7707B23A330DD17C8'
        if ((Get-FileHash binskim.zip -Algorithm SHA512).Hash -ne $expected) { Write-Error 'BinSkim package hash mismatch'; exit 1 }
        Expand-Archive binskim.zip binskim
        $dir = '${{ steps.build.outputs.dir }}'
        binskim\tools\net9.0\win-x64\BinSkim.exe analyze "$dir\ReRoundedTB.exe" "$dir\ReRoundedTB.dll" --output binskim.sarif --log ForceOverwrite
        $failures = @((Get-Content binskim.sarif -Raw | ConvertFrom-Json).runs[0].results | Where-Object { $_.level -in 'error', 'warning' })
        $failures | ForEach-Object { "$($_.ruleId): $($_.message.text)" }
        if ($failures.Count -gt 0) { Write-Error "BinSkim found $($failures.Count) hardening issue(s)"; exit 1 }
        'BinSkim: no hardening issues'

    - name: Upload SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ github.sha }}
        path: sbom\ReRoundedTB.cdx.json

  # Scans the full git history for committed secrets
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # Pinned binary, verified against a hard-coded checksum, instead of a third-party action that needs a token
    - name: Install gitleaks
      run: |
        curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf gitleaks.tar.gz gitleaks
        rm gitleaks.tar.gz

    - name: Scan history
      run: ./gitleaks git --redact --no-banner --verbose .

  # Static analysis; results appear under the repository's Security > Code scanning tab
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: csharp
        build-mode: none
        queries: security-extended

    - name: Analyze
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: /language:csharp

  # Signs, attests and packages a release build. Runs only for master, never for PRs or other branches,
  # so only code that reached master can get a provenance attestation that passes the README's verify command.
  release:
    name: release
    needs: [build, secrets, codeql]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read         # SignPath downloads the unsigned artifact from this run
      id-token: write       # sign build provenance via GitHub's OIDC token
      attestations: write   # store the provenance and SBOM attestations

    steps:
    - name: Download unsigned build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: unsigned-${{ github.sha }}
        path: unsigned

    - name: Download SBOM
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sbom-${{ github.sha }}
        path: sbom

    # Code signing via SignPath Foundation. Skipped until the repository variable SIGNPATH_ORGANIZATION_ID is set
    # (plus SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN). See .signpath/README.md.
    - name: Sign with SignPath
      id: sign
      if: vars.SIGNPATH_ORGANIZATION_ID != ''
      uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        github-artifact-id: ${{ needs.build.outputs.artifact-id }}
        parameters: |
          version: "${{ needs.build.outputs.version }}"
        wait-for-completion: true
        output-artifact-directory: signed

    - name: Check signatures
      if: steps.sign.outcome == 'success'
      run: |
        foreach ($f in 'signed\ReRoundedTB.exe', 'signed\ReRoundedTB.dll') {
          $sig = Get-AuthenticodeSignature $f
          "$f : $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne 'Valid') { exit 1 }
        }

    - name: Package
      run: |
        $src = if (Test-Path signed\ReRoundedTB.exe) { (Resolve-Path signed).Path } else { (Resolve-Path unsigned).Path }
        "Packaging from $src"
        Compress-Archive -Path "$src\*" -DestinationPath ReRoundedTB.zip
        Copy-Item "$src\ReRoundedTB.exe", "$src\ReRoundedTB.dll" .

    # Lets anyone confirm a download was built from master by this workflow (see README for the exact command)
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          ReRoundedTB.zip
          ReRoundedTB.exe
          ReRoundedTB.dll

    - name: Attest SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ReRoundedTB.zip
        sbom-path: sbom/ReRoundedTB.cdx.json

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rertb-${{ github.sha }}
        path: |
          ReRoundedTB.zip
          sbom/ReRoundedTB.cdx.json
